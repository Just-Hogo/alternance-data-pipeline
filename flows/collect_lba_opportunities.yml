id: collect_lba_opportunities
namespace: alternance.data_engineering

tasks:
  - id: fetch_lba_opportunities
    type: io.kestra.plugin.core.http.Request

    uri: https://api.apprentissage.beta.gouv.fr/api/job/v1/search
    method: GET

    headers:
      Authorization: "Bearer {{ secret('LBA_API_KEY') }}"
      Accept: application/json

    params:
      romes: "{{ json(read('config/search_config.json')).la_bonne_alternance.rome_codes | join(',') }}"

    options:
      allowedResponseCodes:
        - 200
      connectTimeout: PT10S
      readTimeout: PT30S
      maxContentLength: 52428800

    retry:
      type: constant
      interval: PT30S
      maxAttempts: 3
      maxDuration: PT5M
      warningOnRetry: false


  - id: define_ingestion_context
    type: io.kestra.plugin.core.execution.SetVariables

    variables:

      collected_at: >-
        {{ execution.startDate
            | date("yyyy-MM-dd'T'HH:mm:ssX", timeZone="UTC") }}

      raw_file_path: >-
        /data/raw/lba/raw_{{ execution.startDate
            | date('yyyy_MM_dd', timeZone='UTC') }}_{{ execution.id }}.json

      fetched_offer_count: >-
        {{ outputs.fetch_lba_opportunities.body
            | jq('(.jobs // []) | length')
            | first }}


  - id: log_fetched_opportunities
    type: io.kestra.plugin.core.log.Log
    message: "{{ vars.fetched_offer_count }} offres récupérées"


  - id: create_raw_json
    type: io.kestra.plugin.scripts.python.Commands

    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker

    containerImage: python:3.12-slim

    namespaceFiles:
      enabled: true
      include:
        - /scripts/create_raw_json.py

    inputFiles:
      lba_response.json: "{{ outputs.fetch_lba_opportunities.body }}"

    env:
      EXECUTION_ID: "{{ execution.id }}"
      EXECUTION_DATE: "{{ execution.startDate | date('yyyy_MM_dd', timeZone='UTC') }}"

    outputFiles:
      - "raw_{{ execution.startDate | date('yyyy_MM_dd', timeZone='UTC') }}_{{ execution.id }}.json"

    commands:
      - python scripts/create_raw_json.py lba_response.json


  - id: archive_raw_json
    type: io.kestra.plugin.fs.local.Upload

    from: "{{ outputs.create_raw_json.outputFiles | values | first }}"

    to: '{{ vars.raw_file_path }}'

    overwrite: false


  - id: insert_into_ingestion_runs
    type: io.kestra.plugin.jdbc.postgresql.Query

    url: "jdbc:postgresql://alternance-postgres:5432/alternance"
    username: "{{ secret('ALTERNANCE_POSTGRES_USERNAME') }}"
    password: "{{ secret('ALTERNANCE_POSTGRES_PASSWORD') }}"

    sql: |
      INSERT INTO lba.ingestion_runs (
        kestra_execution_id,
        collected_at,
        raw_file_path,
        fetched_offer_count
      )
      VALUES (
        '{{ execution.id }}',
        '{{ vars.collected_at }}',
        '{{ vars.raw_file_path }}',
        {{ vars.fetched_offer_count }}
      );



outputs:
  - id: raw_file
    type: FILE
    value: "{{ outputs.create_raw_json.outputFiles | values | first }}"

  - id: failed_task_id
    type: STRING
    value: >-
      {{ tasksWithState('FAILED') | length > 0
          ? tasksWithState('FAILED')[0]['taskId']
          : '' }}
