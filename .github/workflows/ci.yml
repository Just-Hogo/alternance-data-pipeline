name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests Python, configuration et PostgreSQL
    runs-on: ubuntu-latest

    services:
      alternance-postgres:
        image: postgres:18
        env:
          POSTGRES_DB: alternance_test
          POSTGRES_USER: alternance_test
          POSTGRES_PASSWORD: alternance_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alternance_test -d alternance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances de développement
        run: python -m pip install --requirement requirements-dev.txt

      - name: Vérifier le code Python
        run: ruff check scripts tests

      - name: Exécuter les tests
        env:
          TEST_DATABASE_URL: postgresql://alternance_test:alternance_test_password@127.0.0.1:5432/alternance_test
        run: python -m pytest --quiet

      - name: Valider la configuration Docker Compose
        env:
          KESTRA_POSTGRES_DB: kestra_test
          KESTRA_POSTGRES_USER: kestra_test
          KESTRA_POSTGRES_PASSWORD: kestra_test_password
          ALTERNANCE_POSTGRES_DB: alternance_test
          ALTERNANCE_POSTGRES_USER: alternance_test
          ALTERNANCE_POSTGRES_PASSWORD: alternance_test_password
        run: |
          touch .env_encoded
          docker compose config --quiet
